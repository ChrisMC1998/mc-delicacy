/* track & admin */
const ST=["Order Placed","Confirmed","Preparing","Ready for Dispatch","Out for Delivery","Delivered","Cancelled"];
function track(id){const o=S.orders.find(x=>x.id==(id||"").trim().toUpperCase());return`<div class="wrap" style="padding:60px 20px"><h2 style="font-size:48px">Track your order</h2><div class="f" style="max-width:420px"><label for="tid">Order number</label><input id="tid" value="${esc(id||"")}"><button class="btn" style="margin-top:12px" data-act="trk">Track</button></div>${id?(o?`<div class="stbar">${ST.slice(0,6).map((s,i)=>`<span class="${o.st!=6&&i<=o.st?"d":""}">${s}</span>`).join("")}</div><p>${o.st==6?"This order was cancelled.":"Status: <b>"+ST[o.st]+"</b>"}</p>`:`<p>No order found with that number on this device.</p>`):""}</div>`}
function adm(){if(!admin)return`<div class="wrap" style="padding:60px 20px;max-width:440px"><h2 style="font-size:40px">Admin sign in</h2><div class="f"><label for="ap">Passcode</label><input id="ap" type="password"><div class="er" id="ae"></div><button class="btn" data-act="login">Sign in</button></div><p style="color:var(--mute);font-size:13px">Demo gate only: this check runs in the browser and is not secure. Replace with server-side auth before going live.</p></div>`;
const T=S.cfg;let b="";
if(atab=="products")b=`<button class="btn s" data-act="newp">Add product</button><div class="scr"><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Tag</th><th>Image</th><th>On</th><th></th></tr>${S.products.map(p=>`<tr><td><input class="ainp" data-pf="n" data-id="${p.id}" value="${esc(p.n)}"><input class="ainp" data-pf="d" data-id="${p.id}" value="${esc(p.d)}" placeholder="Description"><input class="ainp" data-pf="al" data-id="${p.id}" value="${esc(p.al)}" placeholder="Allergens (if confirmed)"></td><td><select class="ainp" data-pf="c" data-id="${p.id}">${CATS.map(c=>`<option value="${c[0]}"${c[0]==p.c?" selected":""}>${c[1]}</option>`).join("")}</select></td><td><input class="ainp" type="number" data-pf="p" data-id="${p.id}" value="${p.p}"></td><td><select class="ainp" data-pf="t" data-id="${p.id}">${["","Bestseller","New"].map(t=>`<option${t==p.t?" selected":""}>${t}</option>`).join("")}</select></td><td><input type="file" accept="image/*" data-img="${p.id}"></td><td><input type="checkbox" data-pf="on" data-id="${p.id}" ${p.on?"checked":""} aria-label="Enabled"></td><td><button data-delp="${p.id}" style="color:#ff8a80">Delete</button></td></tr>`).join("")}</table></div>`;
if(atab=="orders")b=S.orders.length?`<div class="scr"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>${S.orders.map(o=>`<tr><td>${o.id}<br><small>${esc(o.at)}</small></td><td>${esc(o.f.name)}<br>${esc(o.f.phone)}<br>${esc(o.f.addr)} ${esc(o.f.land||"")}<br><small>${esc(o.f.ins||"")}</small></td><td>${o.items.map(i=>`${i.q}× ${esc(i.n)}${i.o?" ("+esc(i.o)+")":""}`).join("<br>")}</td><td>${inr(o.c.g)}<br><small>${o.pay}</small></td><td><select class="ainp" data-os="${o.id}">${ST.map((s,i)=>`<option value="${i}"${i==o.st?" selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`:"<p>No orders yet.</p>";
if(atab=="settings")b=`<div class="f" style="max-width:520px">${[["delivery","Delivery charge (₹)"],["freeAbove","Free delivery above (₹)"],["tax","Tax %"],["min","Minimum order (₹)"]].map(x=>`<label>${x[1]}</label><input type="number" data-cf="${x[0]}" value="${T[x[0]]}">`).join("")}<label><input type="checkbox" data-cf="cod" ${T.cod?"checked":""} style="width:auto"> Cash on delivery enabled</label><label><input type="checkbox" data-cf="open" ${T.open?"checked":""} style="width:auto"> Accepting orders</label><h3 style="margin-top:24px">Promo codes</h3>${T.codes.map((c,i)=>`<div class="row"><span>${esc(c.code)} · ${c.pct}%</span><button data-delc="${i}" style="color:#ff8a80">Remove</button></div>`).join("")}<div class="row"><input id="nc" placeholder="CODE"><input id="np" type="number" placeholder="% off"><button class="btn s" data-act="addc">Add</button></div></div>`;
if(atab=="offers")b=`${S.offers.map((o,i)=>`<div class="rev f" style="margin:10px 0"><input class="ainp" data-of="t" data-i="${i}" value="${esc(o.t)}"><input class="ainp" data-of="d" data-i="${i}" value="${esc(o.d)}"><input class="ainp" data-of="terms" data-i="${i}" value="${esc(o.terms)}"><div class="row"><input class="ainp" data-of="code" data-i="${i}" value="${esc(o.code)}" placeholder="Promo code"><input class="ainp" type="datetime-local" data-of="end" data-i="${i}" value="${esc(o.end)}" title="Countdown shows only if set"><button data-delo="${i}" style="color:#ff8a80">Delete</button></div></div>`).join("")}<button class="btn s" data-act="newo">Add offer</button>`;
if(atab=="enquiries")b=S.enq.length?S.enq.map(e=>`<div class="rev" style="margin:8px 0"><b>${esc(e.n)}</b> · ${esc(e.p)} <small>${esc(e.at)}</small><p>${esc(e.m)}</p></div>`).join(""):"<p>No enquiries yet.</p>";
return`<div class="wrap" style="padding:40px 20px"><div class="row"><h2 style="font-size:40px">Admin</h2><button class="btn o s" data-act="logout">Sign out</button></div><div class="tabs">${["products","orders","offers","enquiries","settings"].map(t=>`<button class="${t==atab?"on":""}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>${b}</div>`}
/* render + events */
function render(){const h=location.hash.slice(1),a=$("#app");if(h=="admin")a.innerHTML=adm();else if(h=="track")a.innerHTML=track(co.tid);else{if(!a.dataset.home||a.dataset.home!="1"||!$("#build")){a.innerHTML=home();a.dataset.home="1";build();fx()}return}a.dataset.home="0"}
function fx(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll(".sr").forEach(e=>io.observe(e))}
function refreshMenu(){$("#mg").innerHTML=menuGrid();fx();document.querySelectorAll(".cat").forEach(c=>c.classList.toggle("on",c.dataset.cat==filt))}
addEventListener("hashchange",()=>{render();$("#lk").classList.remove("open");if(!["menu","build","offers","cats","top","story","faq","contact"].includes(location.hash.slice(1)))scrollTo(0,0)});
document.addEventListener("click",e=>{const t=e.target.closest("[data-add],[data-open],[data-cat],[data-b],[data-bn],[data-q],[data-rm],[data-act],[data-code],[data-pay],[data-cn],[data-tab],[data-delp],[data-delc],[data-delo],.pic");if(e.target.id=="ov")return open("md",false);if(e.target.id=="bm")return $("#lk").classList.toggle("open");if(e.target.closest("#cb")){drawer();return open("dr",true)}if(!t)return;const d=t.dataset;
if(d.add){const p=S.products.find(x=>x.id==d.add);addItem(p.n,p.p,1,"",p.id)}
else if(d.open)pModal(d.open);
else if(d.cat){filt=d.cat;if(location.hash!="#menu")location.hash="#menu";refreshMenu();$("#menu").scrollIntoView()}
else if(d.b){const k=d.b,i=+d.i;if(k=="top"||k=="ex")bs[k]=bs[k].includes(i)?bs[k].filter(x=>x!=i):[...bs[k],i];else bs[k]=i;build()}
else if(d.bn){bs.st=Math.max(0,Math.min(5,bs.st+ +d.bn));build()}
else if(d.q!=null&&d.v){const i=cart[+d.q];i.q+=+d.v;if(i.q<1)cart.splice(+d.q,1);saveC();drawer()}
else if(d.rm!=null){cart.splice(+d.rm,1);saveC();drawer()}
else if(d.code){promo=S.cfg.codes.find(c=>c.code==d.code)||null;toast(promo?"Code applied":"Code not valid");cart.length&&drawer()}
else if(d.pay){co.pay=d.pay}
else if(d.cn)cnext(+d.cn);
else if(d.tab){atab=d.tab;render()}
else if(d.delp){if(confirm("Delete this product?")){S.products=S.products.filter(p=>p.id!=d.delp);save();render()}}
else if(d.delc){S.cfg.codes.splice(+d.delc,1);save();render()}
else if(d.delo){S.offers.splice(+d.delo,1);save();render()}
else if(d.act){const a=d.act;
 if(a=="close"){open("dr",false);open("md",false)}
 if(a=="promo"){const c=$("#pc").value.trim().toUpperCase();promo=S.cfg.codes.find(x=>x.code==c)||null;toast(promo?"Code applied":"Code not valid");drawer()}
 if(a=="checkout"){open("dr",false);co.st=0;chk()}
 if(a=="addb"){const b=bs;addItem("Custom Burger",bPrice(),1,[BASE[b.base][0],CHZ[b.cheese][0],...b.top.map(i=>TOP[i][0]),b.sauce>=0?SAU[b.sauce][0]:"",...b.ex.map(i=>EXT[i][0])].filter(Boolean).join(", "),"cb"+JSON.stringify(b))}
 if(a=="trk"){co.tid=$("#tid").value;render()}
 if(a=="login"){if($("#ap").value==CONFIG.adminPass){admin=true;render()}else $("#ae").textContent="Incorrect passcode."}
 if(a=="logout"){admin=false;render()}
 if(a=="enq"){const n=$("#en").value.trim(),p=$("#ep").value.trim(),m=$("#em").value.trim();if(!n||!/^[6-9][0-9]{9}$/.test(p)||m.length<5)return toast("Add your name, a 10-digit mobile and a message.");if(CONFIG.whatsapp){window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("From "+n+" ("+p+"): "+m),"_blank","noopener")}else{S.enq.unshift({n,p,m,at:new Date().toLocaleString()});save();toast("Saved on this device only. Set CONFIG.whatsapp to reach staff.")}["#en","#ep","#em"].forEach(i=>$(i).value="")}
 if(a=="newp"){S.products.unshift({id:"p"+Date.now(),c:"bg",n:"New product",p:99,v:1,e:"🍔",t:"",d:"Describe it",on:1,al:"",img:""});save();render()}
 if(a=="newo"){S.offers.push({t:"New offer",d:"",terms:"",code:"",end:""});save();render()}
 if(a=="addc"){const c=$("#nc").value.trim().toUpperCase(),p=+$("#np").value;if(c&&p>0&&p<=100){S.cfg.codes.push({code:c,pct:p});save();render()}}
 if(a=="review"){$("#md").innerHTML=`<div class="mb f"><button class="x" data-act="close">×</button><h2>Write a review</h2><label for="rn">Name</label><input id="rn"><label for="rs">Rating</label><select id="rs">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join("")}</select><label for="rt">Your review</label><textarea id="rt" rows="3"></textarea><button class="btn" style="margin-top:12px" data-act="subr">Submit</button></div>`;open("md",true)}
 if(a=="subr"){const n=$("#rn").value.trim(),t=$("#rt").value.trim();if(n&&t){S.reviews.unshift({n,t,s:+$("#rs").value});save();open("md",false);$("#app").dataset.home="0";render()}else toast("Add your name and review.")}
 if(a=="legal"){$("#md").innerHTML=`<div class="mb"><button class="x" data-act="close">×</button><h2>${esc(d.k)}</h2><p>Add your business’s ${esc(d.k.toLowerCase())} here before launch. This text must be provided by the owner.</p></div>`;open("md",true)}}
});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if(d.pf){const p=S.products.find(x=>x.id==d.id);p[d.pf]=d.pf=="on"?t.checked?1:0:d.pf=="p"?Math.max(0,+t.value):t.value;save()}
if(d.os){S.orders.find(o=>o.id==d.os).st=+t.value;save()}
if(d.cf){S.cfg[d.cf]=t.type=="checkbox"?t.checked?1:0:+t.value;save()}
if(d.of){S.offers[+d.i][d.of]=t.value;save()}
if(d.img&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,600/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.products.find(p=>p.id==d.img).img=c.toDataURL("image/jpeg",.75);save();toast("Image saved")};im.src=r.result};r.readAsDataURL(t.files[0])}});
document.addEventListener("input",e=>{if(e.target.id=="ms"){q=e.target.value.trim().toLowerCase();refreshMenu()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){open("dr",false);open("md",false)}if(e.key=="Enter"&&e.target.classList.contains("pic"))pModal(e.target.dataset.open)});
addEventListener("mousemove",e=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;document.querySelectorAll(".fl").forEach(f=>f.style.translate=`${x*+f.dataset.d}px ${y*+f.dataset.d}px`)});
setInterval(()=>document.querySelectorAll(".cd").forEach(c=>{const ms=new Date(c.dataset.end)-Date.now();c.textContent=ms>0?Math.floor(ms/36e5)+"h "+Math.floor(ms%36e5/6e4)+"m":"ended"}),1000);
saveC();render();
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;setTimeout(()=>$("#intro").classList.add("off"),rm?200:2300);$("#intro").onclick=()=>$("#intro").classList.add("off");
</script></body></html>
